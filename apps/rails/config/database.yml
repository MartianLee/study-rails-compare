default: &default
  adapter: mysql2
  encoding: utf8mb4
  host: <%= ENV.fetch("DB_HOST", "mysql") %>
  username: <%= ENV.fetch("DB_USER", "bench") %>
  password: <%= ENV.fetch("DB_PASSWORD", "bench") %>
  database: <%= ENV.fetch("DB_NAME", "blogbench") %>
  pool: <%= ENV.fetch("DB_POOL", 5) %>
  reaping_frequency: 0
  # matched with apps/rails-bare so the pair uses the same wire protocol
  prepared_statements: true

production:
  <<: *default
